name: Build Signed APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 📥 Clone repo
      - uses: actions/checkout@v4

      # ☕ Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ⚙️ Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 🔐 Decode keystore
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-release-key.jks

      # ✅ BAY PERMISSION (FIX ERÈ OU TE GEN AN)
      - name: Give permission to gradlew
        run: chmod +x gradlew

      # 🔨 Build RELEASE APK (SIGNED)
      - name: Build Release APK
        run: ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=my-release-key.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # 📦 Upload APK
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NS4-RELEASE-APK
          path: app/build/outputs/apk/release/app-release.apk
