name: Build APK

on:
  push:
    branches: [ main ]  # Lè ou fè push sou branch main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js (pou Capacitor)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Setup Java (obligatwa pou Android build)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5️⃣ Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          build-tools: 33.0.2
          target: default

      # 6️⃣ Ajoute Android platform si li poko egziste
      - name: Add Android platform
        run: npx cap add android || echo "Android platform already added"

      # 7️⃣ Kopi fichye web nan Android
      - name: Copy web assets to Android
        run: npx cap copy android

      # 8️⃣ Build APK
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 9️⃣ Upload APK kòm artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quizApp-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
