/* ========= CALCUL SUBJECT PROGRESS ========= */
function getSubjectPercent(subject){

  const progress = JSON.parse(localStorage.getItem("ns4_progress")||"{}");

  const levels=[
  "niveau1","niveau2","niveau3","niveau4","niveau5",
  "niveau6","niveau7","niveau8","niveau9","niveau10"
  ];

  let passed=0;

  levels.forEach(l=>{
    if(progress[subject] && progress[subject][l] && progress[subject][l].examPassed){
      passed++;
    }
  });

  return Math.round((passed/levels.length)*100);
}

/* ========= INIT BUTTONS ========= */

document.querySelectorAll(".subjectBtn").forEach(btn=>{

  const subject = btn.dataset.subject;

  const percent = getSubjectPercent(subject);

  const percentBox = btn.querySelector(".subjectPercent");

  if(percentBox){

    percentBox.innerText = percent+"%";

    if(percent < 40) percentBox.style.background="#e74c3c";
    else if(percent < 80) percentBox.style.background="#f39c12";
    else percentBox.style.background="#2ecc71";

  }

  btn.addEventListener("click",function(){
    startQuiz(subject,window.NS4_QUESTIONS);
  });

});
