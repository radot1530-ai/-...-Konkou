<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NS4 Paramètres</title>
<link rel="stylesheet" href="parametres.css">
<style>
  body{font-family:Arial,sans-serif;background:linear-gradient(135deg,darkorange,black);margin:0;padding:20px;}
  h2,h3{color:#1e88e5;}
  .section{margin-bottom:30px;padding:15px;background:#fff;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1);}
  label{display:block;margin-bottom:5px;font-weight:bold;}
  input, select, button{padding:8px 12px;margin-bottom:10px;border-radius:5px;border:1px solid #ccc;}
  button{background:#1e88e5;color:white;border:none;cursor:pointer;}
  button:hover{background:#1565c0;}
</style>
</head>
<body>

<h1>Paramèt⚙️</h1>
<!-- Pseudo & Kont -->
<div class="section">
  <h3>Kont itilizatè</h3>
  <label for="pseudo">Chanje pseudo:</label>
  <input type="text" id="pseudo" placeholder="Antre nouvo pseudo">
  <button id="savePseudoBtn">💾 Save Pseudo</button>
  <p id="pseudoStatus"></p>
</div>

<!-- Son Background -->
<div class="section">
  <h3>Son Background</h3>
  <label for="bgMusicSelect">Chwazi yon son:</label>
  <select id="bgMusicSelect">
    <option value="/son/Beautiful_Slow_Instrumental_-_music_for_studying,_background,_healing,_relax_-_relaxdaily_N°062(48k).mp3">Son 1</option>
    <option value="/son/Beautiful_Slow_Instrumental_-_music_for_studying,_background,_healing,_relax_-_relaxdaily_N°062(48k).mp3">Son 2</option>
    <option value="/son/Lazarre Patrice - Repons kòrèk (1)">Son 3</option>
  </select>
  <button id="playBgMusicBtn">▶️ Jwe</button>
  <button id="stopBgMusicBtn">⏹ Sispann</button>
</div>

<!-- Opsyon jeneral -->
<div class="section">
  <h3>Opsyon jeneral</h3>
  <label><input type="checkbox" id="soundEffectsCheckbox" checked> Aktive son efè (click, XP, win)</label>
  <label><input type="checkbox" id="pushNotifCheckbox" checked> Aktive push notifications</label>
  <button id="resetProgressBtn">♻️ Reset Pwogresyon</button>
  <p id="resetStatus"></p>
</div>

<script src="xxxlxx.js"></script>
</body>
</html>
