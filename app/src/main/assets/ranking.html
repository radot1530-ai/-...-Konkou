<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NS4 Progress</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:darkorange;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#1e88e5;
}

.card{
background:linear-gradient(135deg,darkorange,black);
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
margin-top:20px;
}

.circle{
width:150px;
height:150px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
margin:auto;
background:conic-gradient(#1e88e5 0deg,#ddd 0deg);
}

.badges{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.badge{
background:#ffd54f;
padding:6px 12px;
border-radius:20px;
}

#xp{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:40px;
color:#1e88e5;
opacity:0;
transition:all 0.6s;
}

</style>

</head>

<body>

<h2>🚀 Progresyon</h2>

<div class="card">

<div id="circle" class="circle">0%</div>

<h2 id="level"></h2>

<p>⭐ Points: <span id="points"></span></p>

<p>🔥 Streak: <span id="streak"></span></p>

</div>


<div class="card">

<h3>🏅 Badges</h3>

<div id="badges" class="badges"></div>

</div>


<div class="card">

<h3>📊 Progress Graph</h3>

<canvas id="chart"></canvas>

</div>


<div class="card">

<h3>🏆 Leaderboard</h3>

<ul id="leaderboard"></ul>

</div>


<div class="card">

<h3>🧠 Revision</h3>

<p id="revision"></p>

</div>

<div id="xp">+10 XP</div>
<script src="xxxlxx.js"></script>
<script src="progress.js"></script>

</body>
</html>
