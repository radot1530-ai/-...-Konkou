<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vokabilè NS4</title>
<style>
body{
    font-family:Arial;
    background:navajowhite;
    margin:0;
    padding:20px;
}
h2{text-align:center;color:#1e88e5;}
.subjects{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}
.subject{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
    cursor:pointer;
    font-weight:bold;
    text-align:center;
}
.backBtn{
    background:#1e88e5;
    color:white;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    margin-bottom:10px;
}
.wordCard{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
    opacity:0;
    transform:translateY(20px);
    transition: all 0.4s ease;
}
.wordCard.show{
    opacity:1;
    transform:translateY(0);
}
.definition{margin-top:8px;}
.lesson{
    background:#eef3ff;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
}
textarea{
    width:100%;
    margin-top:10px;
    padding:8px;
    border-radius:6px;
    border:1px solid #ddd;
}
.hidden{display:none;}
.downloadBtn{
    margin-top:15px;
    background:#1e88e5;
    color:white;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
.loading{
    text-align:center;
    margin:10px 0;
    color:#1e88e5;
    font-weight:bold;
}
</style>
</head>
<body>

<h2>📘 Vokabilè + Leson</h2>

<div id="subjects" class="subjects">
    <div class="subject" onclick="openSubject('philo')">🧠 Philosophie</div>
    <div class="subject" onclick="openSubject('phys')">⚡ Physique</div>
    <div class="subject" onclick="openSubject('math')">📐 Math</div>
<div class="subject" onclick="openSubject('chimi')">
🧪 Chimi
</div>
<div class="subject" onclick="openSubject('svt')">
🧬 Byoloji/Jewoloji 
</div>
<div class="subject" onclick="openSubject('eng')">
  🏴󠁧󠁢󠁥󠁮󠁧󠁿 Anglè
</div>
<div class="subject" onclick="openSubject('esp')">
  🇪🇸 Espanòl
</div>
<div class="subject" onclick="openSubject('kreyòl')">
  🇭🇹 Kreyòl 
</div>
<div class="subject" onclick="openSubject('ekonomi')">
  💰 Ekonomi
</div>
<div class="subject" onclick="openSubject('art')">
  🎨 Art
</div>
</div>

<!-- Matyè containers -->
<div id="philo" class="hidden"><button class="backBtn" onclick="goBack()">⬅ Retour</button></div>
<div id="phys" class="hidden"><button class="backBtn" onclick="goBack()">⬅ Retour</button></div>
<div id="math" class="hidden"><button class="backBtn" onclick="goBack()">⬅ Retour</button></div>

<div id="chimi" class="hidden"><button class="backBtn" onclick="goBack()">⬅ Retour</button></div>

<div id="svt" class="hidden"><button class="backBtn" onclick="goBack()">⬅ Retour</button></div>

<div id="eng" class="hidden"><button class="backBtn" onclick="goBack()">⬅ Retour</button></div>

<div id="esp" class="hidden"><button class="backBtn" onclick="goBack()">⬅ Retour</button></div>

<div id="kreyòl" class="hidden"><button class="backBtn" onclick="goBack()">⬅ Retour</button></div>

<div id="ekonomi" class="hidden"><button class="backBtn" onclick="goBack()">⬅ Retour</button></div>

<div id="art" class="hidden"><button class="backBtn" onclick="goBack()">⬅ Retour</button></div>

<button class="downloadBtn" onclick="downloadVocabulary()">⬇ Telechaje tout mo</button>
<div id="loading" class="loading hidden">Ap telechaje mo yo...</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="vocab.js"></script>
<script src="xxxlxx.js"></script>
</body>
</html>
